name: valis-wsi
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - openjdk=17
  - maven
  - openslide=3.4.1
  - openslide-python=1.3.1
  - pixman=0.40.0
  - libvips=8.14.5
  - openjpeg
  - libtiff
  - tifffile
  - imagecodecs
  - numpy<2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.1+cpu
      - torchvision==0.22.1+cpu
      - pyvips==2.2.3
      - valis-wsi==1.2.0
variables:
  JAVA_HOME: /home/a6000/anaconda3/envs/valis-wsi/lib/jvm
